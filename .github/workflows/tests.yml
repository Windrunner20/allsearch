name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test (offline; no provider keys)
        run: pytest -q
      - name: Whitespace check
        if: runner.os == 'Linux'
        run: git diff --check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel, install the wheel, run the CLI
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/allsearch --version
          /tmp/wheel-venv/bin/allsearch hash-token ci-check
      - name: Docker image builds and refuses to start without tokens
        run: |
          docker build -t allsearch:ci .
          set +e
          docker run --rm allsearch:ci; code=$?
          set -e
          test "$code" = "2"
